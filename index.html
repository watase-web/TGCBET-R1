<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;


/* ════════════ コースデータ（東京ゴルフ倶楽部） ════════════ */
const COURSE = {
  OUT: [
    {hole:1,par:4,hdcp:13},{hole:2,par:4,hdcp:3},{hole:3,par:5,hdcp:9},
    {hole:4,par:3,hdcp:17},{hole:5,par:5,hdcp:7},{hole:6,par:4,hdcp:1},
    {hole:7,par:4,hdcp:5},{hole:8,par:3,hdcp:15},{hole:9,par:4,hdcp:11},
  ],
  IN: [
    {hole:10,par:4,hdcp:6},{hole:11,par:4,hdcp:10},{hole:12,par:3,hdcp:14},
    {hole:13,par:5,hdcp:2},{hole:14,par:4,hdcp:8},{hole:15,par:5,hdcp:18},
    {hole:16,par:4,hdcp:4},{hole:17,par:3,hdcp:16},{hole:18,par:4,hdcp:12},
  ],
};
const PLAYER_KEYS = ["A","B","C","D"];
const MATCHUP_PAIRS = [["A","B"],["A","C"],["A","D"],["B","C"],["B","D"],["C","D"]];
/* ナッソー: 各18Hは 前ハーフ1pt / 後ハーフ2pt / 18Hトータル1pt（2ラウンド目も同構成） */
const HALF_DEFS = [
  {id:"half1",label:"ハーフ1",pt:1},
  {id:"half2",label:"ハーフ2",pt:2},
  {id:"half3",label:"ハーフ3",pt:1},
  {id:"half4",label:"ハーフ4",pt:2},
];

/* ════════════ 純粋計算ロジック ════════════ */
function strokesForHole(diff, hdcp){
  const h = parseInt(diff)||0;
  if(h<=0) return 0;
  return Math.floor(h/18) + (h%18>=hdcp?1:0);
}
/* 2人間ネット（個人HCP差方式・マッチプレー標準） */
function pairNets(gX,gY,hX,hY,hdcp){
  const d=Math.abs(hX-hY);
  let sX=0,sY=0;
  if(hX>hY) sX=strokesForHole(d,hdcp);
  else if(hY>hX) sY=strokesForHole(d,hdcp);
  return [gX-sX, gY-sY];
}
/* 個人ベスト（全勝制）: 有効スコアの他全員にネットで勝つ */
function bestWinner(gross,hcps,hdcp){
  const valid=PLAYER_KEYS.filter(pk=>gross[pk]!==undefined);
  if(valid.length<2) return null;
  for(const X of valid){
    let all=true;
    for(const Y of valid){
      if(X===Y) continue;
      const [nX,nY]=pairNets(gross[X],gross[Y],hcps[X],hcps[Y],hdcp);
      if(!(nX<nY)){ all=false; break; }
    }
    if(all) return X;
  }
  return null;
}
/* イモ（全敗制）: 有効スコアの他全員にネットで負ける */
function imoWinner(gross,hcps,hdcp){
  const valid=PLAYER_KEYS.filter(pk=>gross[pk]!==undefined);
  if(valid.length<2) return null;
  for(const X of valid){
    let all=true;
    for(const Y of valid){
      if(X===Y) continue;
      const [nX,nY]=pairNets(gross[X],gross[Y],hcps[X],hcps[Y],hdcp);
      if(!(nX>nY)){ all=false; break; }
    }
    if(all) return X;
  }
  return null;
}
/* チーム編成: 自動=HCP最小×最大（同点は登録順）／手動=3パターンから選択 */
function determineTeams(players, pairing){
  if(pairing==="AB") return { team1:["A","B"], team2:["C","D"] };
  if(pairing==="AC") return { team1:["A","C"], team2:["B","D"] };
  if(pairing==="AD") return { team1:["A","D"], team2:["B","C"] };
  const srt=[...PLAYER_KEYS].sort((a,b)=>{
    const ha=parseInt(players[a].hcp)||0, hb=parseInt(players[b].hcp)||0;
    return ha-hb || PLAYER_KEYS.indexOf(a)-PLAYER_KEYS.indexOf(b);
  });
  return { team1:[srt[0],srt[3]], team2:[srt[1],srt[2]] };
}
function calcTeamHcp(players,team1,team2){
  const s1=team1.reduce((s,pk)=>s+(parseInt(players[pk].hcp)||0),0);
  const s2=team2.reduce((s,pk)=>s+(parseInt(players[pk].hcp)||0),0);
  const diff=Math.abs(s1-s2);
  const recv = s1>s2?1 : s2>s1?2 : 0;
  return {sum1:s1,sum2:s2,diff,recv};
}
/* ベスト&グロス: 素のグロス、チームハンデのみ。
   つけるか=コース全体HDCP<=差 / ベスト or グロス=ハーフ内順位の偶奇 */
function teamHoleBG(g,team1,team2,diff,hdcp,halfRank,recv){
  const v1=team1.map(pk=>g[pk]).filter(v=>v!==undefined);
  const v2=team2.map(pk=>g[pk]).filter(v=>v!==undefined);
  if(!v1.length||!v2.length) return {m1:null,m2:null};
  const applies = diff>0 && hdcp<=diff;
  const app = !applies?null:(halfRank%2===1?"best":"gross");
  let b1=Math.min(...v1), b2=Math.min(...v2);
  if(app==="best"&&recv){ if(recv===1)b1-=1; else b2-=1; }
  const m1 = b1<b2?1:b1>b2?-1:0;
  let m2=null;
  if(v1.length===2&&v2.length===2){
    let s1=v1[0]+v1[1], s2=v2[0]+v2[1];
    if(app==="gross"&&recv){ if(recv===1)s1-=1; else s2-=1; }
    m2 = s1<s2?1:s1>s2?-1:0;
  }
  return {m1,m2};
}
/* ハイ&ロー: ロー同士・ハイ同士を個人HCP差ネットで対戦 */
function sortTeamByHcp(team,players){
  return [...team].sort((a,b)=>{
    const ha=parseInt(players[a].hcp)||0, hb=parseInt(players[b].hcp)||0;
    return ha-hb || PLAYER_KEYS.indexOf(a)-PLAYER_KEYS.indexOf(b);
  });
}
function teamHoleHL(g,team1,team2,players,hdcp){
  const [lo1,hi1]=sortTeamByHcp(team1,players);
  const [lo2,hi2]=sortTeamByHcp(team2,players);
  const hcp=pk=>parseInt(players[pk].hcp)||0;
  let m1=null,m2=null;
  if(g[lo1]!==undefined&&g[lo2]!==undefined){
    const [n1,n2]=pairNets(g[lo1],g[lo2],hcp(lo1),hcp(lo2),hdcp);
    m1 = n1<n2?1:n1>n2?-1:0;
  }
  if(g[hi1]!==undefined&&g[hi2]!==undefined){
    const [n1,n2]=pairNets(g[hi1],g[hi2],hcp(hi1),hcp(hi2),hdcp);
    m2 = n1<n2?1:n1>n2?-1:0;
  }
  return {m1,m2};
}
/* ラスベガス: ネットで2桁（小が十の位）。ネット＝4人の最少HCP基準（差分をHDCP順に引く）。
   バーディー（グロスのみで判定）で相手逆転、両方なら両方逆転。差は5切上げ */
function vegasNet(g,pk,hcps,hdcp){
  const minH=Math.min(...PLAYER_KEYS.map(k=>hcps[k]));
  const d=hcps[pk]-minH;
  return g[pk]-strokesForHole(d,hdcp);
}
function vegasHole(g,team1,team2,par,hcps,hdcp){
  const all=[...team1,...team2];
  if(all.some(pk=>g[pk]===undefined)) return null;
  /* バーディーはグロスのみで判定 */
  const b1=team1.some(pk=>g[pk]<=par-1);
  const b2=team2.some(pk=>g[pk]<=par-1);
  /* 数字はネット（最少HCP基準）で作る */
  const v1=team1.map(pk=>vegasNet(g,pk,hcps,hdcp));
  const v2=team2.map(pk=>vegasNet(g,pk,hcps,hdcp));
  const mk=(arr,flip)=>{
    const lo=Math.min(...arr), hi=Math.max(...arr);
    return flip? hi*10+lo : lo*10+hi;
  };
  /* 片方だけバーディー→相手の数字が逆転 / 両方→両方逆転 */
  const flip1 = (b2&&!b1) || (b1&&b2);
  const flip2 = (b1&&!b2) || (b1&&b2);
  const n1=mk(v1,flip1), n2=mk(v2,flip2);
  const diff=Math.abs(n1-n2);
  const pts = diff===0?0:Math.ceil(diff/5)*5;
  const winner = n1<n2?1:n1>n2?-1:0;
  return {n1,n2,pts,winner,b1,b2};
}
function sideFromWins(w1,w2){ return {w1,w2,winner:w1>w2?1:w1<w2?-1:0}; }

/* ════════════ 全体計算（純関数） ════════════ */
function computeAll(st){
  const {players,halfConfig,scores,game,teamMode,rates,teamPairing}=st;
  const payMode = game==="tentwo" ? 10 : 5;  // ファイブワン=5点, テントゥートゥーワン=10点（自動）
  const hcps={}; PLAYER_KEYS.forEach(pk=>hcps[pk]=parseInt(players[pk].hcp)||0);
  const {team1,team2}=determineTeams(players,teamPairing);
  const thcp=calcTeamHcp(players,team1,team2);
  const isTen = game==="tentwo";
  const activeHalves = HALF_DEFS.filter(hd=>halfConfig[hd.id]);

  const zero=()=>({A:0,B:0,C:0,D:0});
  const cntBirdie=zero(),cntBest=zero(),cntImo=zero();
  const bonusPts=zero(), strokePts=zero(), vegasPts=zero();
  const strokePairs={}; MATCHUP_PAIRS.forEach(([a,b])=>strokePairs[a+b]=0);
  const pairHoleWins={}; /* halfId -> pairKey -> array of 1/-1/0 */
  const halves={};

  activeHalves.forEach(hd=>{
    const ct=halfConfig[hd.id];
    const courseHoles = ct==="OUT"?COURSE.OUT:COURSE.IN;
    const sc=scores[hd.id]||{};
    const halfRank={};
    [...courseHoles].sort((a,b)=>a.hdcp-b.hdcp).forEach((h,i)=>{halfRank[h.hole]=i+1;});
    const teamRes={}, vegas={}, vsA={}, bestPk={}, imoPk={};
    const grossTot=zero(); const grossCnt=zero();
    pairHoleWins[hd.id]={}; MATCHUP_PAIRS.forEach(([a,b])=>pairHoleWins[hd.id][a+b]=[]);

    courseHoles.forEach(h=>{
      const g={};
      PLAYER_KEYS.forEach(pk=>{
        const v=parseInt(sc[h.hole]?.[pk]);
        if(!isNaN(v)&&v>0){ g[pk]=v; grossTot[pk]+=v; grossCnt[pk]++; }
      });
      /* バーディー */
      PLAYER_KEYS.forEach(pk=>{
        if(g[pk]!==undefined && g[pk]<=h.par-1){
          cntBirdie[pk]++;
          bonusPts[pk]+=3;
          PLAYER_KEYS.forEach(o=>{ if(o!==pk) bonusPts[o]-=1; });
        }
      });
      /* ベスト（全勝制） */
      const bw=bestWinner(g,hcps,h.hdcp);
      if(bw){ bestPk[h.hole]=bw; cntBest[bw]++;
        bonusPts[bw]+=3; PLAYER_KEYS.forEach(o=>{ if(o!==bw) bonusPts[o]-=1; });
      }
      /* イモ（全敗制・テントゥーのみ点数化） */
      const iw=imoWinner(g,hcps,h.hdcp);
      if(iw){ imoPk[h.hole]=iw;
        if(isTen){ cntImo[iw]++;
          bonusPts[iw]-=3; PLAYER_KEYS.forEach(o=>{ if(o!==iw) bonusPts[o]+=1; });
        }
      }
      /* チーム戦 */
      teamRes[h.hole] = teamMode==="highlow"
        ? teamHoleHL(g,team1,team2,players,h.hdcp)
        : teamHoleBG(g,team1,team2,thcp.diff,h.hdcp,halfRank[h.hole],thcp.recv);
      /* ラスベガス */
      if(isTen){
        const vg=vegasHole(g,team1,team2,h.par,hcps,h.hdcp);
        if(vg){
          vegas[h.hole]=vg;
          if(vg.winner!==0){
            const winT=vg.winner===1?team1:team2, loseT=vg.winner===1?team2:team1;
            winT.forEach(pk=>vegasPts[pk]+=vg.pts);
            loseT.forEach(pk=>vegasPts[pk]-=vg.pts);
          }
        }
      }
      /* 個人ペア: ナッソー勝敗 & ストローク差 */
      MATCHUP_PAIRS.forEach(([p1,p2])=>{
        const key=p1+p2;
        if(g[p1]!==undefined&&g[p2]!==undefined){
          const [n1,n2]=pairNets(g[p1],g[p2],hcps[p1],hcps[p2],h.hdcp);
          pairHoleWins[hd.id][key].push(n1<n2?1:n1>n2?-1:0);
          if(isTen) strokePairs[key]+=(n2-n1); /* 正=p1勝ち */
        } else {
          pairHoleWins[hd.id][key].push(null);
        }
      });
      /* 自分(A) vs 他3人 の当ホールネット差 */
      const va={};
      ["B","C","D"].forEach(o=>{
        if(g.A!==undefined&&g[o]!==undefined){
          const [nA,nO]=pairNets(g.A,g[o],hcps.A,hcps[o],h.hdcp);
          va[o]=nO-nA; /* 正=自分勝ち */
        }
      });
      vsA[h.hole]=va;
    });

    /* チームのハーフ勝敗: 2勝負の総勝ち数 */
    let w1=0,w2=0,c1a=0,c1b=0,c2a=0,c2b=0;
    courseHoles.forEach(h=>{
      const r=teamRes[h.hole]; if(!r) return;
      if(r.m1===1){w1++;c1a++;} else if(r.m1===-1){w2++;c2a++;}
      if(r.m2===1){w1++;c1b++;} else if(r.m2===-1){w2++;c2b++;}
    });
    const teamSide={...sideFromWins(w1,w2), m1w1:c1a,m1w2:c2a,m2w1:c1b,m2w2:c2b};

    /* 個人ペアのハーフ勝敗 */
    const pairSides={};
    MATCHUP_PAIRS.forEach(([p1,p2])=>{
      const arr=pairHoleWins[hd.id][p1+p2].filter(v=>v!==null);
      pairSides[p1+p2]=sideFromWins(arr.filter(v=>v===1).length, arr.filter(v=>v===-1).length);
    });

    halves[hd.id]={courseHoles,halfRank,teamRes,vegas,vsA,bestPk,imoPk,grossTot,grossCnt,teamSide,pairSides};
  });

  if(isTen){
    MATCHUP_PAIRS.forEach(([p1,p2])=>{
      const s=strokePairs[p1+p2];
      strokePts[p1]+=s; strokePts[p2]-=s;
    });
  }

  /* 18Hトータル（half1+2 / half3+4、両方アクティブ時のみ） */
  const combineSide=(hids,key)=>{
    const arr=[]; hids.forEach(hid=>{ if(pairHoleWins[hid]) arr.push(...pairHoleWins[hid][key].filter(v=>v!==null)); });
    return sideFromWins(arr.filter(v=>v===1).length, arr.filter(v=>v===-1).length);
  };
  const frontActive = !!(halfConfig.half1&&halfConfig.half2);
  const backActive  = !!(halfConfig.half3&&halfConfig.half4);

  /* ナッソー・マッチアップ集計 */
  const matchups={}; const nassauPts=zero();
  MATCHUP_PAIRS.forEach(([p1,p2])=>{
    const key=p1+p2; let pts=0; const detail=[];
    activeHalves.forEach(hd=>{
      const s=halves[hd.id].pairSides[key];
      pts += hd.pt*s.winner;
      detail.push({label:hd.label,pt:hd.pt,side:s});
    });
    if(frontActive){
      const s=combineSide(["half1","half2"],key);
      pts+=s.winner; detail.push({label:"前半18H",pt:1,side:s});
    }
    if(backActive){
      const s=combineSide(["half3","half4"],key);
      pts+=s.winner; detail.push({label:"後半18H",pt:1,side:s});
    }
    matchups[key]={pts,detail};
    nassauPts[p1]+=pts; nassauPts[p2]-=pts;
  });

  /* 個人合計（点） */
  const indivTen=zero();
  PLAYER_KEYS.forEach(pk=>{
    indivTen[pk] = nassauPts[pk]*payMode + bonusPts[pk] + (isTen? strokePts[pk]+vegasPts[pk] : 0);
  });

  /* チーム戦マネー */
  const teamMoney=zero(); const lunch=[]; const halfMoney={};
  activeHalves.forEach(hd=>{
    const side=halves[hd.id].teamSide;
    if(side.winner===0){ halfMoney[hd.id]={type:"draw"}; return; }
    const winT=side.winner===1?team1:team2, loseT=side.winner===1?team2:team1;
    const isLunch = hd.id==="half1" && (game==="fiveone" || rates.half1.type==="lunch");
    if(isLunch){
      lunch.push({half:hd.label,loser:loseT});
      halfMoney[hd.id]={type:"lunch",loser:loseT,winner:winT};
    } else {
      const yen = hd.id==="half1" ? (parseInt(rates.half1.yen)||0) : (parseInt(rates[hd.id])||0);
      winT.forEach(pk=>teamMoney[pk]+=yen*loseT.length);
      loseT.forEach(pk=>teamMoney[pk]-=yen*winT.length);
      halfMoney[hd.id]={type:"money",yen,loser:loseT,winner:winT};
    }
  });

  const grand=zero();
  PLAYER_KEYS.forEach(pk=>{ grand[pk]=indivTen[pk]*100+teamMoney[pk]; });

  const myTeam = team1.includes("A")?1:2;
  return {team1,team2,thcp,myTeam,halves,activeHalves,matchups,nassauPts,
    cntBirdie,cntBest,cntImo,bonusPts,strokePairs,strokePts,vegasPts,
    indivTen,teamMoney,lunch,halfMoney,grand,frontActive,backActive};
}

          <Card title="👥 プレーヤー（1人目=自分）">
            {PLAYER_KEYS.map(pk=>(
              <div key={pk} style={{display:"flex",gap:6,marginBottom:6,alignItems:"center"}}>
                <span style={{width:18,color:"#d4af37",fontWeight:"bold",fontSize:12}}>{pk}</span>
                <input value={players[pk].name} placeholder="名前" onChange={e=>setPlayers(p=>({...p,[pk]:{...p[pk],name:e.target.value}}))}
                  style={{...inSt,flex:2}}/>
                <input type="number" inputMode="numeric" value={players[pk].hcp} placeholder="HCP" onChange={e=>setPlayers(p=>({...p,[pk]:{...p[pk],hcp:e.target.value}}))}
                  style={{...inSt,flex:1}}/>
              </div>
            ))}
            <div style={{marginTop:10}}>
              <div style={{fontSize:12,color:"#d4af37",marginBottom:4}}>チーム編成</div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                <button onClick={()=>setTeamPairing("auto")} style={selBtn(teamPairing==="auto")}>自動<br/><span style={{fontSize:9}}>HCP最小×最大</span></button>
                {[["AB","C","D"],["AC","B","D"],["AD","B","C"]].map(([pr,o1,o2])=>(
                  <button key={pr} onClick={()=>setTeamPairing(pr)} style={selBtn(teamPairing===pr)}>
                    {nm2("A")}&{nm2(pr[1])}<br/><span style={{fontSize:9}}>vs {nm2(o1)}&{nm2(o2)}</span>
                  </button>
                ))}
              </div>
            </div>
            <div style={{fontSize:12,textAlign:"center",marginTop:8,color:"#a8c4b0"}}>
              チーム編成: <span style={{color:"#4ade80"}}>T1 {nm(C.team1[0])}&{nm(C.team1[1])}</span>
              <span style={{margin:"0 4px"}}>vs</span>
              <span style={{color:"#f87171"}}>T2 {nm(C.team2[0])}&{nm(C.team2[1])}</span>
              <span style={{marginLeft:6}}>差{C.thcp.diff}</span>
            </div>
          </Card>
          <Card title="⛳ ハーフ構成">
            <div style={{marginBottom:8}}>
              <div style={{fontSize:12,color:"#d4af37",marginBottom:4}}>ハーフ1（1pt）</div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>setHalf1("OUT")} style={selBtn(halfConfig.half1==="OUT")}>OUT（H1-9）</button>
                <button onClick={()=>setHalf1("IN")} style={selBtn(halfConfig.half1==="IN")}>IN（H10-18）</button>
              </div>
            </div>
            <div style={{marginBottom:8}}>
              <div style={{fontSize:12,color:"#d4af37",marginBottom:4}}>ハーフ2（2pt）</div>
              <div style={{fontSize:12,color:"#a8c4b0"}}>{halfConfig.half2}（ハーフ1と自動連動）</div>
            </div>
            <div style={{marginBottom:8}}>
              <div style={{fontSize:12,color:"#d4af37",marginBottom:4}}>ハーフ3（1pt・2ラウンド目）</div>
              {halfConfig.half3?(
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <button onClick={()=>setHalf3("OUT")} style={selBtn(halfConfig.half3==="OUT")}>OUT</button>
                  <button onClick={()=>setHalf3("IN")} style={selBtn(halfConfig.half3==="IN")}>IN</button>
                  <button onClick={()=>setHalfConfig(c=>({...c,half3:null,half4:null}))} style={btnSt("#f87171")}>削除</button>
                </div>
              ):(
                <button onClick={()=>setHalfConfig(c=>({...c,half3:"OUT"}))} style={btnSt("#4ade80")}>＋ 追加する</button>
              )}
            </div>
            {halfConfig.half3&&(
              <div style={{marginBottom:4}}>
                <div style={{fontSize:12,color:"#d4af37",marginBottom:4}}>ハーフ4（2pt）</div>
                {halfConfig.half4?(
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <span style={{fontSize:12,color:"#a8c4b0"}}>{halfConfig.half4}（ハーフ3と自動連動）</span>
                    <button onClick={()=>setHalfConfig(c=>({...c,half4:null}))} style={btnSt("#f87171")}>削除</button>
                  </div>
                ):(
                  <button onClick={()=>setHalfConfig(c=>({...c,half4:c.half3==="OUT"?"IN":"OUT"}))} style={btnSt("#4ade80")}>＋ 追加する</button>
                )}
              </div>
            )}
            <p style={noteSt}>2ラウンド目（ハーフ3+4）は「18ホールをもう1周」として、1ラウンド目と同じポイント構成（1pt/2pt/18H計1pt）。</p>
          </Card>
          <Card title="💾 データ">
            <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center"}}>
              <button onClick={handleExport} style={btnSt("#4ade80")}>💾 保存</button>
              <button onClick={handleImport} style={btnSt("#38bdf8")}>📂 読込</button>
              <button onClick={handleSample} style={btnSt("#8B6914")}>📋 サンプル</button>
              <button onClick={()=>setConfirmClear("scores")} style={btnSt("#fbbf24")}>🗑️ スコアクリア</button>
              <button onClick={()=>setConfirmClear("all")} style={btnSt("#f87171")}>⚠️ すべてクリア</button>
            </div>
          </Card>
        </>)}
      </div>
    </div>
  );
}

/* ===== 共通UI ===== */
const inSt = {boxSizing:"border-box",padding:"8px 10px",borderRadius:6,background:"rgba(0,0,0,0.3)",border:"1px solid #4a7a5a",color:"#f5f0e8",fontSize:14,outline:"none",minWidth:0};
const btnSt = (c)=>({padding:"7px 14px",borderRadius:6,border:`1px solid ${c}`,background:`${c}22`,color:c,cursor:"pointer",fontSize:12,fontFamily:"inherit"});
const selBtn = (active)=>({padding:"9px 14px",borderRadius:8,cursor:"pointer",fontSize:13,fontFamily:"inherit",
  border:`2px solid ${active?"#d4af37":"#4a7a5a"}`,
  background:active?"rgba(212,175,55,0.18)":"rgba(0,0,0,0.2)",
  color:active?"#d4af37":"#a8c4b0",fontWeight:active?"bold":"normal"});
const rateInp = {width:80,textAlign:"center",padding:"6px 6px",fontSize:14,borderRadius:6,border:"2px solid #d4af37",background:"rgba(0,0,0,0.3)",color:"#f5f0e8",outline:"none"};
const tblTh = {padding:"5px 6px",fontSize:11,color:"#d4af37",borderBottom:"1px solid rgba(212,175,55,0.4)",textAlign:"center",whiteSpace:"nowrap"};
const tblTd = {padding:"5px 6px",textAlign:"center",borderBottom:"1px solid rgba(74,122,90,0.25)",whiteSpace:"nowrap"};
const noteSt = {fontSize:10,color:"#a8c4b0",marginTop:8,lineHeight:1.6};

function Card({title,children}){
  return (
    <div style={{background:"rgba(26,92,56,0.25)",border:"1px solid rgba(212,175,55,0.35)",borderRadius:12,padding:"12px 12px",marginBottom:12}}>
      {title&&<div style={{fontSize:14,fontWeight:"bold",color:"#d4af37",marginBottom:8,borderBottom:"1px solid rgba(212,175,55,0.25)",paddingBottom:6}}>{title}</div>}
      {children}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<GolfNassau />);
</script>
</body>
</html>
